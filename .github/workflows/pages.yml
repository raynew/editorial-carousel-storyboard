name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Upload and deploy are separate jobs, as in GitHub's own Pages workflow: when deploy-pages ran in the
  # same job straight after the upload, GitHub sometimes hadn't registered the artifact yet and the deploy failed.
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Stamp version number
        run: |
          VERSION="v$(git rev-list --count HEAD)"
          BUILD="Commit ${GITHUB_SHA::7}, $(git log -1 --format=%cs)"
          sed -i "s/__APP_VERSION__/$VERSION/; s/__APP_BUILD__/$BUILD/" carousel-editor/carousel.html
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v5
